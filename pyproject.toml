[project]
name = "pypi-sdk"
version = "1.0.0"
description = "Typed Python client for PyPI's public APIs and package publishing"
readme = "README.md"
authors = [
    { name = "Eli-ezer Reuven Ramirez Ruiz", email = "ramirez.ruiz.eliezer.reuven@gmail.com" }
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
keywords = ["pypi", "python-packaging", "sdk", "publishing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12.0,<3",
]

[project.optional-dependencies]
publish = ["twine>=6.0"]

[project.scripts]
pypi-sdk = "pypi_sdk.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pypi_sdk"
source-include = [
    "AGENTS.MD",
    "CLAUDE.md",
    "CHANGELOG.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "docs/**",
    "examples/**",
    "benchmarks/**",
    "tests/**",
    "mkdocs.yml",
    ".github/workflows/**",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=pypi_sdk --cov-report=term-missing --cov-branch --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["pypi_sdk"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src"]

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
]
benchmark = ["pytest-benchmark>=5.3.0"]
benchcore = ["benchcore[pytest]>=1.0.0,<2"]
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[tool.uv.dependency-groups]
benchcore = { requires-python = ">=3.12" }
